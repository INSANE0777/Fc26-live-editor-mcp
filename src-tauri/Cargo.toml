[package]
name = "fc26-squad-editor"
version = "0.1.0"
description = "FC 26 Squad Editor — Tauri shell + Python sidecar"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true